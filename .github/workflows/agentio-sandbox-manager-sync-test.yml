name: agentio-sandbox-manager-sync-test

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Released Agentio chart version to test'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  SANDBOX_MANAGER_CHART: versions/kruise-agents-sandbox-manager/next
  TEST_BASE_BRANCH: workflow-test-upstream-master

concurrency:
  group: agentio-sandbox-manager-sync-test-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out upstream charts
        uses: actions/checkout@v5
        with:
          repository: openkruise/charts
          ref: master
          path: charts
          fetch-depth: 0
          persist-credentials: false

      - name: Check out Agentio test source
        uses: actions/checkout@v5
        with:
          repository: Kuromesi/agentio
          ref: codex/agentio-chart-pr
          path: agentio
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache: false

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Pull released Agentio chart
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/released-agentio"
          helm pull oci://docker.io/openkruise/agentio \
            --version "$VERSION" \
            --untar \
            --untardir "$RUNNER_TEMP/released-agentio"

      - name: Generate sandbox-manager Agentio templates
        working-directory: agentio
        run: |
          go test ./tools/agentio-chart-exporter
          go run ./tools/agentio-chart-exporter \
            --source "$RUNNER_TEMP/released-agentio/agentio" \
            --target "$GITHUB_WORKSPACE/charts/$SANDBOX_MANAGER_CHART"

      - name: Verify generated sandbox-manager chart
        working-directory: charts
        run: |
          target="$SANDBOX_MANAGER_CHART"
          disabled="$RUNNER_TEMP/sandbox-manager-disabled.yaml"
          enabled="$RUNNER_TEMP/sandbox-manager-agentio-enabled.yaml"

          helm lint "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test
          helm template sandbox-manager "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test >"$disabled"
          if grep -q '# Source: .*templates/agentio/' "$disabled"; then
            echo "Agentio resources rendered while agentio.enabled=false" >&2
            exit 1
          fi

          helm template sandbox-manager "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test \
            --set agentio.enabled=true >"$enabled"
          if ! grep -q '# Source: .*templates/agentio/' "$enabled"; then
            echo "Agentio resources did not render while agentio.enabled=true" >&2
            exit 1
          fi

          if grep -R -E '(^|[[:space:]])(chartVersion|appVersion|sourceCommit):' \
            "$target/templates/agentio" "$target/values.yaml"; then
            echo "Generated sandbox-manager chart contains forbidden Agentio version metadata" >&2
            exit 1
          fi

          helm template sandbox-manager "$target" \
            --set e2b.adminApiKey=test \
            --set ingress.className=test \
            --set agentio.enabled=true \
            --set agentio.ambient.enabled=true \
            --set agentio.sidecarInjector.enabled=true \
            --set agentio.global.enableClusterTrustBundle=true >/dev/null

          git diff --check

      - name: Publish isolated test branch and pull request
        working-directory: charts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="workflow-test-sync-agentio-sandbox-manager-${VERSION}"
          target="$SANDBOX_MANAGER_CHART"
          generated_paths=(
            "$target/values.yaml"
            "$target/templates/agentio"
            "$target/files/agentio"
          )
          fork_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add fork "$fork_url"

          if git fetch fork "refs/heads/${TEST_BASE_BRANCH}:refs/remotes/fork/${TEST_BASE_BRANCH}"; then
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "fork/${TEST_BASE_BRANCH}")" ]]; then
              echo "Existing isolated test base no longer matches upstream master" >&2
              exit 1
            fi
          else
            git push fork "HEAD:refs/heads/${TEST_BASE_BRANCH}"
          fi

          if [[ -z "$(git status --porcelain -- "${generated_paths[@]}")" ]]; then
            echo "Kuromesi sandbox-manager already contains the generated Agentio chart; skipping."
            exit 0
          fi

          if git fetch fork "refs/heads/${branch}:refs/remotes/fork/${branch}"; then
            if ! git diff --quiet "fork/${branch}" -- "${generated_paths[@]}"; then
              echo "Existing isolated test branch contains different generated content" >&2
              exit 1
            fi
            pr_url=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch" \
              --state all \
              --json url \
              --jq '.[0].url // ""')
            echo "Isolated sync test already exists: ${pr_url:-branch $branch}"
            exit 0
          fi

          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${generated_paths[@]}"
          git commit --signoff -m "test(kruise-agents-sandbox-manager): sync agentio ${VERSION}"
          git push fork "HEAD:refs/heads/${branch}"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TEST_BASE_BRANCH" \
            --head "$branch" \
            --draft \
            --title "[workflow test] sync Agentio ${VERSION} into sandbox-manager" \
            --body "Isolated workflow test generated from openkruise/agentio ${VERSION}. This PR targets only the Kuromesi/charts fork."
